[package]
name = "t5-bench"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "t5-bench"
path = "src/main.rs"

[dependencies]
witchcraft = { path = "../..", default-features = false, features = ["t5-quantized"] }
candle-core = { git = "https://github.com/huggingface/candle", rev = "5bd5618" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "5bd5618" }
candle-transformers = { git = "https://github.com/huggingface/candle", rev = "5bd5618" }
openvino = { version = "0.10.0", features = ["runtime-linking"], optional = true }
tokenizers = { version = "0.22", default-features = false }
anyhow = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
zstd = "0.13.3"
tempfile = "3.20.0"

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
accelerate-src = { version = "0.3.2", optional = true }
libc = { version = "0.2.147", optional = true }

[features]
default = ["ov"]
ov = ["dep:openvino"]
accelerate = ["dep:libc", "dep:accelerate-src", "candle-core/accelerate"]
hybrid-dequant = ["witchcraft/hybrid-dequant"]
fbgemm = ["witchcraft/fbgemm"]
metal = ["witchcraft/metal"]
