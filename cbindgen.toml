language = "C"
include_guard = "WITCHCRAFT_H"
cpp_compat = true
usize_is_size_t = true
style = "Both"
autogen_warning = "/* Generated by cbindgen from src/capi.rs. Do not edit by hand. */"

[parse]
parse_deps = false

[export]
include = [
    "WitchcraftHandle",
    "WitchcraftBytes",
    "WitchcraftSearchHit",
    "WitchcraftSearchResults",
    "WitchcraftEmbeddingCallback",
    "witchcraft_open",
    "witchcraft_close",
    "witchcraft_embed",
    "witchcraft_add",
    "witchcraft_index",
    "witchcraft_search",
    "witchcraft_bytes_free",
    "witchcraft_search_results_free",
    "witchcraft_last_error",
]
