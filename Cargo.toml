[package]
name = "witchcraft"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[workspace]                     # !Dash
members = ["tools/quantize", "tools/t5-bench", "tools/modernbert-bench", "tools/compare-backends", "tools/trec-score", "tools/pickbrain-watch", "crates/chromium-idb"] # !Dash

[[bin]]                         # !Dash
name = "warp-cli"               # !Dash
path = "src/main.rs"            # !Dash

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "*"
serde = "*"
serde_json = "*"

candle-core = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645" }
candle-nn = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645" }
candle-transformers = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645" }

tokenizers = { version = "0.22", features = ["fancy-regex"] }
serde_plain = "1.0.2"
rand = "0.10.1"
sha2 = "0.11.0"
indicatif = { version = "0.18.4", optional = true }

csv = "1.3.1"
tempfile = "3.20.0"

napi = { version = "3.2.2", optional = true }
napi-derive = { version = "3.2.2", optional = true }
pyo3 = { version = "0.23", optional = true, features = ["extension-module", "abi3-py38"] }
once_cell = "1.21.3"
lru = "0.18.0"
tracing = "0.1.41"
safetensors = "0.8.0"
uuid = {version = "1.18.1", features = ["v5"] }
iso8601-timestamp = "0.4.0"
log = "0.4.28"
text-splitter = { version = "0.30.1", features = ["markdown"] } # !Dash
regex = "1"                # !Dash
chrono = "0.4"             # !Dash
lz4_flex = "0.13.0"
tar = { version = "0.4", optional = true }
zstd = { version = "0.13.3", optional = true }
strsim = "0.11.1"
libc = "0.2"
rayon = { version = "1", optional = true }
half = "2"
fbgemm-rs = { git = "https://github.com/jacobgorm/fbgemm-rs", rev = "71595cd89ccd49aa272bfa9ae2a78b5f4e3048c1", optional = true, features = ["rayon"] }

[dev-dependencies]
pickbrain-watch = { path = "tools/pickbrain-watch" }
test-log = { version = "0.2.16", features = ["trace", "color"] }
ratatui = "0.30"
crossterm = "0.29"
chromium-idb = { path = "crates/chromium-idb" }

# Apple Silicon (ARM) - enable Metal support
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645", features = ["metal"] }
candle-nn = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645", features = ["metal"] }
candle-metal-kernels = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645", optional=true }
metal = { version = "0.33.0", features = ["mps"], optional = true }
ug-metal = { version = "0.5.0", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }

# Intel (x86_64) - Neso-generated scalar Metal kernels
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
candle-core = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645", features = ["metal"] }
candle-nn = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645", features = ["metal"] }
candle-metal-kernels = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645", optional=true }
metal = { version = "0.33.0", features = ["mps"], optional = true }
ug-metal = { version = "0.5.0", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }

# Windows - priority management
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
candle-d3d12-kernels = { git = "https://github.com/jacobgorm/candle", rev = "2f819fe896d42ee12e2e8a411f917d5aac655645", optional = true }

[build-dependencies]
cbindgen = "0.29.3"
napi-build = "2.2.3"
tar = "0.4"
zstd = "0.13.3"

[features]
#default = ["t5-quantized"]
default = []
napi = ["dep:napi", "dep:napi-derive", "sqlite"]
python = ["dep:pyo3"]
t5-quantized = []
modernbert = []
modernbert-quantized = []
embed-assets = []
progress = ["dep:indicatif"]
metal = ["dep:metal", "dep:candle-metal-kernels", "dep:ug-metal"]
neso-metal = ["metal", "dep:dispatch2", "dep:objc2-metal", "dep:tar", "dep:zstd"]
neso-d3d12 = ["dep:candle-d3d12-kernels", "dep:tar", "dep:zstd"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
hybrid-dequant = ["dep:rayon"]
fbgemm = ["dep:fbgemm-rs"]
deterministic = []
capi-embed-cache = []
sqlite = ["dep:rusqlite"]

[dependencies.rusqlite]
version = "0.39.0"
features = ["bundled"]
optional = true
